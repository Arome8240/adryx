services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: adryx-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: adryx
      MONGO_INITDB_ROOT_PASSWORD: adryx_password
      MONGO_INITDB_DATABASE: adryx
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - adryx-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: adryx-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api/v1
      MONGODB_URI: mongodb://adryx:adryx_password@mongodb:27017/adryx?authSource=admin
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SOLANA_RPC_URL: https://api.devnet.solana.com
      SOLANA_PROGRAM_ID: Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - adryx-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_SOLANA_NETWORK: devnet
        NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
    container_name: adryx-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_SOLANA_NETWORK: devnet
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - adryx-network

volumes:
  mongodb_data:
    driver: local

networks:
  adryx-network:
    driver: bridge
